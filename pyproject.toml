[tool.poetry]
name = "stuff-website"
version = "0.1.0"
description = "Website with handy stuff"
authors = ["DY <aaskorohodov@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.150.0"
uvicorn = "^0.54.0"
jinja2 = "^3.1.6"

[tool.poetry.group.test.dependencies]
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
pytest = "^9.1.1"
pytest-httpx = "^0.36.2"
coverage = "^7.16.2"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
env_files = ".test-env"
asyncio_mode = "auto"
pythonpath = "."

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
  "D203", "D107", "D202", "D209", "D208",
  "D410", "D411", "D415", "D104", "D100", "E722"
]
exclude = ["tests/*"]
select = ["E", "F", "UP", "D"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"